version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cryptoplace_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cryptoplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cryptoplace_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/cryptoplace?schema=public"
      JWT_SECRET: "cryptoplace_pro_super_secret_jwt_key_2026_secure"
      COINGECKO_BASE_URL: "https://api.coingecko.com/api/v3"
      FRONTEND_URL: "http://localhost:3000"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cryptoplace_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
    driver: local

